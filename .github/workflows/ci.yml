name: Continuous Integration (uv)
on: [push, pull_request]

# Note: Environment variables (PROJECT_NAME and vars from [tool.wads.ci.env])
# are set by the read-ci-config action in the setup job and made available
# to all subsequent jobs via GITHUB_ENV

jobs:
  # First job: Read configuration from pyproject.toml
  setup:
    name: Read Configuration
    runs-on: ubuntu-latest
    outputs:
      project-name: ${{ steps.config.outputs.project-name }}
      python-versions: ${{ steps.config.outputs.python-versions }}
      pytest-args: ${{ steps.config.outputs.pytest-args }}
      coverage-enabled: ${{ steps.config.outputs.coverage-enabled }}
      exclude-paths: ${{ steps.config.outputs.exclude-paths }}
      test-on-windows: ${{ steps.config.outputs.test-on-windows }}
      build-sdist: ${{ steps.config.outputs.build-sdist }}
      build-wheel: ${{ steps.config.outputs.build-wheel }}
      metrics-enabled: ${{ steps.config.outputs.metrics-enabled }}
      metrics-config-path: ${{ steps.config.outputs.metrics-config-path }}
      metrics-storage-branch: ${{ steps.config.outputs.metrics-storage-branch }}
      metrics-python-version: ${{ steps.config.outputs.metrics-python-version }}
      metrics-force-run: ${{ steps.config.outputs.metrics-force-run }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Read CI Config
        id: config
        uses: i2mint/wads/actions/read-ci-config@master
        with:
          pyproject-path: .

  # Second job: Validation using the config
  validation:
    name: Validation
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: i2mint/wads/actions/setup-python-uv@master
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        uses: i2mint/wads/actions/install-system-deps@master
        with:
          pyproject-path: .

      - name: Install Dependencies
        uses: i2mint/wads/actions/install-deps-uv@master

      - name: Format Source Code
        run: uvx ruff format .

      - name: Lint Validation
        run: uvx ruff check --output-format=github ${{ needs.setup.outputs.project-name }}

      - name: Run Tests
        uses: i2mint/wads/actions/run-tests-uv@master
        with:
          root-dir: ${{ needs.setup.outputs.project-name }}
          pytest-args: ${{ needs.setup.outputs.pytest-args }}
          exclude-paths: ${{ needs.setup.outputs.exclude-paths }}
          coverage: ${{ needs.setup.outputs.coverage-enabled }}

      - name: Track Code Metrics
        if: needs.setup.outputs.metrics-enabled == 'true'
        uses: i2mint/umpyre/actions/track-metrics@master
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: ${{ needs.setup.outputs.metrics-config-path }}
          storage-branch: ${{ needs.setup.outputs.metrics-storage-branch }}
          python-version: ${{ needs.setup.outputs.metrics-python-version }}
          force-run: ${{ needs.setup.outputs.metrics-force-run }}

  # Windows testing (enabled in config).
  #
  # DELIBERATE DEVIATION FROM THE WADS TEMPLATE (an#22): the generated template
  # puts `continue-on-error: true` on this job.
  #
  # What that flag actually does — stated precisely, because the first draft of
  # this comment got it wrong and a comment is the standing instruction for
  # re-applying the deviation. It does NOT make GitHub misreport the job. On all
  # five failing runs before this change, the JOB conclusion is `failure`, the
  # `Run Tests` STEP conclusion is `failure`, and the check-run row rendered in
  # the PR checks list reads `Windows Tests / failure`. What the flag changes is
  # the ROLL-UP: the workflow RUN concludes `success`, so the aggregate tick is
  # green and nothing blocks the merge.
  #
  # So the signal was never hidden — it was non-blocking, which is worse in
  # practice, because a reviewer reads the aggregate. Two Windows-only defects
  # reached `main` past a green tick that way:
  #
  #   * a path-separator bug (an#21) — `str(Path.relative_to(...))` yields
  #     backslashes on Windows while the TOML keys it was compared against are
  #     forward-slash paths, so a completeness guard compared two spellings of the
  #     same set;
  #   * an unpinned text encoding — `Path.read_text()` decodes with the LOCALE
  #     codec, cp1252 on Windows, and every doc in this repo contains non-ASCII.
  #     Three tests added in an#16 failed on Windows and merged anyway.
  #
  # Removing the flag therefore buys a red RUN and a blocking merge box. Windows
  # was green on `main` when it was removed, so it costs attention and nothing
  # else.
  #
  # If a future `wads populate` regenerates this file, this deviation is the thing
  # to re-apply — along with the `needs:` edge on `publish` below. The upstream
  # fix is a `[tool.wads.ci.testing] windows_blocking` knob, filed as
  # i2mint/wads#66.
  windows-validation:
    name: Windows Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]') && needs.setup.outputs.test-on-windows == 'true'"
    needs: setup
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: i2mint/wads/actions/setup-python-uv@master
        with:
          python-version: ${{ fromJson(needs.setup.outputs.python-versions)[0] }}

      - name: Install System Dependencies
        uses: i2mint/wads/actions/install-system-deps@master
        with:
          pyproject-path: .

      - name: Install Dependencies
        uses: i2mint/wads/actions/install-deps-uv@master

      - name: Run Tests
        uses: i2mint/wads/actions/run-tests-uv@master
        with:
          root-dir: ${{ needs.setup.outputs.project-name }}

  # Publishing job
  #
  # SECOND DELIBERATE DEVIATION (an#22): `windows-validation` is a `needs` of
  # this job. Without it, making the Windows leg blocking reddens the tick but
  # not the release — a Windows-only failure on `main` still uploads to PyPI,
  # bumps the version and pushes the tag, and the run only goes red afterwards.
  # On this repo a merge to `main` IS the release, so a Windows leg that cannot
  # stop it is a review signal, not a gate.
  #
  # `!failure() && !cancelled()` rather than a bare `needs:` edge: in GitHub
  # Actions a SKIPPED `needs` job skips its dependents, so the bare form would
  # silently stop every release the day someone sets `test_on_windows = false`.
  # These status functions also remove the implicit `success()`, which is why
  # `validation` failing still skips this job.
  publish:
    name: Publish
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, '[skip ci]')
      && !failure() && !cancelled()
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')"
    needs: [setup, validation, windows-validation]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: i2mint/wads/actions/setup-python-uv@master
        with:
          python-version: ${{ fromJson(needs.setup.outputs.python-versions)[0] }}
          create-venv: "false"

      - name: Format Source Code
        run: uvx ruff format .

      - name: Update Version Number
        id: version
        uses: i2mint/isee/actions/bump-version-number@master

      - name: Build Distribution
        uses: i2mint/wads/actions/build-dist-uv@master
        with:
          sdist: ${{ needs.setup.outputs.build-sdist }}
          wheel: ${{ needs.setup.outputs.build-wheel }}

      - name: Publish to PyPI
        uses: i2mint/wads/actions/pypi-publish-uv@master
        with:
          pypi-token: ${{ secrets.PYPI_PASSWORD }}

      - name: Force SSH for git remote
        run: git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: Commit Changes
        uses: i2mint/wads/actions/git-commit@master
        with:
          commit-message: "**CI** Formatted code + Updated version to ${{ env.VERSION }} [skip ci]"
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          push: true

      - name: Tag Repository
        uses: i2mint/wads/actions/git-tag@master
        with:
          tag: ${{ env.VERSION }}
          message: "Release version ${{ env.VERSION }}"
          push: true

  # Optional GitHub Pages
  github-pages:
    name: Publish GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: i2mint/epythet/actions/publish-github-pages@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ignore: "tests/,scrap/,examples/"
