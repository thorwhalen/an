[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "an"
version = "0.1.22"
description = "AI-driven structured animation in Python: scene.md to rendered video."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "animation",
    "ai",
    "python",
    "structured",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic",
    "dol",
    "argh",
    "argcomplete",
    "pyyaml",
    "numpy",
]

[project.scripts]
an = "an.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["an"]

# `packages = ["an"]` above already ships every non-ignored file under `an/`,
# so this block is not what makes these files reach the wheel — verified by
# building one. It is kept as an EXPLICIT INVENTORY of the runtime assets, and
# `tests/test_vendored_engine.py` asserts it stays complete: an asset added to
# the runtime directory and forgotten here fails the suite. The previous,
# partial version of this list (which omitted preview.html) read as though
# preview.html was excluded from the wheel when it was not.
[tool.hatch.build.targets.wheel.force-include]
"an/data/cutout_runtime/index.html" = "an/data/cutout_runtime/index.html"
"an/data/cutout_runtime/preview.html" = "an/data/cutout_runtime/preview.html"
"an/data/cutout_runtime/runtime.js" = "an/data/cutout_runtime/runtime.js"
"an/data/cutout_runtime/README.md" = "an/data/cutout_runtime/README.md"
"an/data/cutout_runtime/vendor/pixi.min.js" = "an/data/cutout_runtime/vendor/pixi.min.js"
"an/data/cutout_runtime/vendor/pixi.LICENSE.txt" = "an/data/cutout_runtime/vendor/pixi.LICENSE.txt"


[project.urls]
Homepage = "https://github.com/thorwhalen/an"
Repository = "https://github.com/thorwhalen/an"
Documentation = "https://thorwhalen.github.io/an"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
cutout = [
    "playwright",
    "ffmpeg-python",
    "numpy",
    # `an.verify.media.ssim` and `an/characters/silhouette.py` import PIL. It was
    # undeclared, so the only two tests in this repo that assert on PIXELS did
    # `pytest.importorskip("PIL.Image")` inside their bodies and skipped in
    # silence when it was absent — the rendering-verification equivalent of the
    # collection hole in an#22.
    "pillow",
]
manim = [
    "manim",
]
remotion = []
tts = [
    "elevenlabs",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
